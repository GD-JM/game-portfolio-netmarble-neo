<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="title desc"><title id="title">랜덤 박스 한 막의 진행</title><desc id="desc">상자에서 보스 등장 후 암전으로 공간을 교체한다. 전조를 읽고 역할을 나눠 수행한다. 실패 시 해당 기믹으로 돌아가며 막이 끝나면 다음 상자로 간다.</desc><style>text{font-family:SUIT,Malgun Gothic,sans-serif;fill:#303b34;font-size:18px} .small{font-size:15px;fill:#526057}.label{font-weight:700}.line{stroke:#8a9b8d;stroke-width:2;fill:none}.route{stroke:#27654a;stroke-width:4;fill:none;marker-end:url(#arrow)} .player{fill:#fff;stroke:#355f49;stroke-width:2}.safe{fill:#dfece1;stroke:#7ea58b;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27654a"/></marker></defs><rect width="640" height="470" fill="#f7f8f3"/><rect x="35" y="35" width="250" height="85" rx="4" fill="#fff" stroke="#94a18f" stroke-width="2"/><text x="160.0" y="70" text-anchor="middle" class="label">상자 열기 · 보스 등장</text><text x="160.0" y="98" text-anchor="middle" class="small">익숙한 보스와 기믹을 호출</text><rect x="355" y="35" width="250" height="85" rx="4" fill="#fff" stroke="#94a18f" stroke-width="2"/><text x="480.0" y="70" text-anchor="middle" class="label">암전 · 공간 교체</text><text x="480.0" y="98" text-anchor="middle" class="small">이번 무대와 이동 경로 확인</text><rect x="355" y="200" width="250" height="100" rx="4" fill="#fff" stroke="#94a18f" stroke-width="2"/><text x="480.0" y="235" text-anchor="middle" class="label">전조 읽기 · 역할 판단</text><text x="480.0" y="263" text-anchor="middle" class="small">동료와 나눠 기믹 수행</text><rect x="35" y="200" width="250" height="100" rx="4" fill="#fff" stroke="#94a18f" stroke-width="2"/><text x="160.0" y="235" text-anchor="middle" class="label">막 종료</text><text x="160.0" y="263" text-anchor="middle" class="small">다음 상자에서 새 상황 시작</text><path class="route" d="M289 77H349"/><path class="route" d="M480 126V193"/><path class="route" d="M349 248H291"/><path class="route" d="M160 194V126"/><text x="320" y="230" text-anchor="middle" class="small">성공</text><path class="route" d="M510 306V375H395V306"/><text x="453" y="405" text-anchor="middle" class="label">실패 → 해당 기믹 재시도</text><text x="453" y="432" text-anchor="middle" class="small">틀린 판단을 확인하고 조정</text></svg>