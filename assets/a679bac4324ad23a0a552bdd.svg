<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" role="img" aria-labelledby="title desc"><title id="title">카운터: 위치와 준비 상태를 함께 판단</title><desc id="desc">가까운 B는 재사용 대기 중이다. 준비된 C가 다음 카운터를 맡는다. A와 D도 현재 상황을 확인한다.</desc><style>text{font-family:SUIT,Malgun Gothic,sans-serif;fill:#303b34;font-size:18px} .small{font-size:15px;fill:#526057}.label{font-weight:700}.line{stroke:#8a9b8d;stroke-width:2;fill:none}.route{stroke:#27654a;stroke-width:4;fill:none;marker-end:url(#arrow)} .player{fill:#fff;stroke:#355f49;stroke-width:2}.safe{fill:#dfece1;stroke:#7ea58b;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27654a"/></marker></defs><rect width="480" height="410" fill="#f7f8f3"/><circle cx="240" cy="205" r="145" fill="none" stroke="#a5b3a5" stroke-width="2"/><circle cx="240" cy="180" r="46" fill="#e1e4dc" stroke="#768675" stroke-width="2"/><path d="M225 224L240 246L255 224" fill="#844729"/><text x="240" y="183" text-anchor="middle" class="label">보스</text><text x="329" y="255" text-anchor="middle" class="small">전방</text><circle class="player" cx="240" cy="310" r="17"/><text x="240" y="316" text-anchor="middle" class="label">B</text><text x="240" y="368" text-anchor="middle" class="small">방금 사용 · 대기</text><circle class="player" cx="105" cy="270" r="17"/><text x="105" y="276" text-anchor="middle" class="label">C</text><text x="90" y="310" text-anchor="middle" class="small">사용 가능</text><circle class="player" cx="93" cy="107" r="17"/><text x="93" y="113" text-anchor="middle" class="label">A</text><circle class="player" cx="387" cy="107" r="17"/><text x="387" y="113" text-anchor="middle" class="label">D</text><path class="route" d="M124 273Q164 280 197 266L220 242"/><text x="240" y="35" text-anchor="middle" class="label">이번 대응은 C가 맡는다</text><text x="240" y="391" text-anchor="middle" class="small">담당은 고정 번호가 아닌 상황으로 결정</text></svg>