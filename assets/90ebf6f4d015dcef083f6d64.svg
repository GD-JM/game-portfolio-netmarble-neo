<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>딜을 덜어낸 자리에 어떤 판단을 남기는가</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#79583e"/></marker></defs><rect width="100%" height="100%" fill="#f5f3ee"/><rect x="28" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="48" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">기존 전투의 주의 부담</text><text x="48" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">공격 사이클 · 재사용 시간</text><text x="48" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">전조 · 이동 · 동료 확인</text><rect x="354" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="374" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">랜덤 박스의 집중 대상</text><text x="374" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">딜 누적 부담 제외</text><text x="374" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">전조와 동료를 읽는 데 집중</text><rect x="680" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="700" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">플레이어의 선택</text><text x="700" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">누가 지금 대응 가능한가</text><text x="700" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">나는 어떤 빈자리를 메울까</text><path d="M320 160H350" stroke="#79583e" stroke-width="2" marker-end="url(#arrow)"/><path d="M646 160H676" stroke="#79583e" stroke-width="2" marker-end="url(#arrow)"/></svg>