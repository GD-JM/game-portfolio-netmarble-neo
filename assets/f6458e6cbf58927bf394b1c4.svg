<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>직접 발견하기보다 답을 기다리게 되는 과정</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#79583e"/></marker></defs><rect width="100%" height="100%" fill="#f5f3ee"/><rect x="28" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="48" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">대응 근거 부족</text><text x="48" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">다음 가설을 좁히기 어려움</text><text x="48" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">경우의 수를 하나씩 시험</text><rect x="354" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="374" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">반복 비용 증가</text><text x="374" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">문제 구간까지 재진행</text><text x="374" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">실패하면 전멸 · 초기화</text><rect x="680" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="700" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">공략을 기다림</text><text x="700" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">발견 비용은 크고</text><text x="700" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">답을 전달받는 비용은 작음</text><path d="M320 160H350" stroke="#79583e" stroke-width="2" marker-end="url(#arrow)"/><path d="M646 160H676" stroke="#79583e" stroke-width="2" marker-end="url(#arrow)"/></svg>