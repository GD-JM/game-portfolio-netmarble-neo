<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>같은 정보 구조가 만드는 두 가지 행동</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#79583e"/></marker></defs><rect width="100%" height="100%" fill="#f5f3ee"/><rect x="28" y="82" width="292" height="156" rx="8" fill="#e5ede5" stroke="#bfc8be"/><text x="48" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">비싸게 발견한 해법</text><text x="48" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">오랜 시도와 집중력 투입</text><text x="48" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">공개되면 쉽게 복제 가능</text><rect x="354" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="374" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">일반 이용자</text><text x="374" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">남이 푼 공략을 기다림</text><text x="374" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">직접 발견의 비용을 피함</text><rect x="680" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="700" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">순위 경쟁자</text><text x="700" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">해법을 공개하지 않음</text><text x="700" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">먼저 발견한 우위를 보호</text><path d="M174 82V45H826V82 M500 45V82" fill="none" stroke="#79583e" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="30" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="16" font-weight="400">두 방향으로 분기</text></svg>