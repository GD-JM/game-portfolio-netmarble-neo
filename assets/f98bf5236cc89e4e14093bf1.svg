<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">보접빨핀: 세 구슬과 분신 위치</title><desc id="desc">A 보라, B 빨강, C 보라로 보라 다수. 7시 접은 날개, 3시 반쯤 편 날개, 11시 완전히 편 날개 순으로 이동한다. D는 관측을 보완한다.</desc><style>text{font-family:SUIT,Malgun Gothic,sans-serif;fill:#303b34;font-size:18px} .small{font-size:15px;fill:#526057}.label{font-weight:700}.line{stroke:#8a9b8d;stroke-width:2;fill:none}.route{stroke:#27654a;stroke-width:4;fill:none;marker-end:url(#arrow)} .player{fill:#fff;stroke:#355f49;stroke-width:2}.safe{fill:#dfece1;stroke:#7ea58b;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27654a"/></marker></defs><rect width="480" height="460" fill="#f7f8f3"/><circle cx="240" cy="217" r="150" fill="none" stroke="#a5b3a5" stroke-width="2"/><circle cx="240" cy="217" r="43" fill="#e1e4dc" stroke="#768675" stroke-width="2"/><text x="240" y="223" text-anchor="middle" class="label">중앙</text><rect x="75" y="54" width="136" height="56" rx="4" fill="#fff" stroke="#73816f" stroke-width="2"/><text x="143" y="76" text-anchor="middle" class="label">11시</text><text x="143" y="99" text-anchor="middle" class="small">완전히 편 날개</text><rect x="324" y="189" width="136" height="56" rx="4" fill="#fff" stroke="#73816f" stroke-width="2"/><text x="392" y="211" text-anchor="middle" class="label">3시</text><text x="392" y="234" text-anchor="middle" class="small">반쯤 편 날개</text><rect x="80" y="322" width="136" height="56" rx="4" fill="#fff" stroke="#73816f" stroke-width="2"/><text x="148" y="344" text-anchor="middle" class="label">7시</text><text x="148" y="367" text-anchor="middle" class="small">접은 날개</text><circle class="player" cx="155" cy="155" r="17"/><text x="155" y="161" text-anchor="middle" class="label">A</text><circle cx="184" cy="149" r="8" fill="#755293"/><text x="186" y="178" text-anchor="middle" class="small">보라</text><circle class="player" cx="350" cy="125" r="17"/><text x="350" y="131" text-anchor="middle" class="label">B</text><circle cx="379" cy="119" r="8" fill="#af4d44"/><text x="381" y="148" text-anchor="middle" class="small">빨강</text><circle class="player" cx="182" cy="276" r="17"/><text x="182" y="282" text-anchor="middle" class="label">C</text><circle cx="211" cy="270" r="8" fill="#755293"/><text x="213" y="299" text-anchor="middle" class="small">보라</text><circle class="player" cx="90" cy="303" r="17"/><text x="90" y="309" text-anchor="middle" class="label">D</text><text x="54" y="271" text-anchor="middle" class="small">관측</text><text x="240" y="29" text-anchor="middle" class="label">표식의 다수 색 + 날개 상태의 위치</text><text x="240" y="421" text-anchor="middle" class="label">보라 2 · 빨강 1 → 접은 날개부터</text><text x="240" y="446" text-anchor="middle" class="small">이 배치에서는 7시 → 3시 → 11시</text></svg>