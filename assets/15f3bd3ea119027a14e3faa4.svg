<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>상시 주간 콘텐츠의 두 가지 쓰임</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#79583e"/></marker></defs><rect width="100%" height="100%" fill="#f5f3ee"/><rect x="28" y="82" width="292" height="156" rx="8" fill="#e5ede5" stroke="#bfc8be"/><text x="48" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">공통 기반</text><text x="48" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">낮은 부담으로 함께 완료</text><text x="48" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">평시 시간 경쟁 · 랭킹 제외</text><rect x="354" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="374" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">신규 레이드 시기</text><text x="374" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">기믹을 분리해 익히기</text><text x="374" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">공개 시점은 별도 설계</text><rect x="680" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="700" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">레이드 공백기</text><text x="700" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">익힌 기믹의 변주 즐기기</text><text x="700" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">익스트림은 별도 도전 운영</text><path d="M174 82V45H826V82 M500 45V82" fill="none" stroke="#79583e" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="30" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="16" font-weight="400">두 방향으로 분기</text></svg>