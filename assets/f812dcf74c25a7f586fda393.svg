<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>일상 플레이 안에서 랜덤 박스가 맡을 자리</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#79583e"/></marker></defs><rect width="100%" height="100%" fill="#f5f3ee"/><rect x="28" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="48" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">카오스 던전</text><text x="48" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">반복 처치 중심</text><text x="48" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">일상적인 플레이</text><rect x="354" y="82" width="292" height="156" rx="8" fill="#e5ede5" stroke="#bfc8be"/><text x="374" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">랜덤 박스</text><text x="374" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">기믹 판단 · 역할 분담</text><text x="374" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">낮은 실패 부담의 주간 콘텐츠</text><rect x="680" y="82" width="292" height="156" rx="8" fill="#ffffff" stroke="#bfc8be"/><text x="700" y="120" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="22" font-weight="700">가디언 토벌</text><text x="700" y="155" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">공격 · 패턴 대응</text><text x="700" y="190" fill="#282b29" font-family="SUIT,Malgun Gothic,sans-serif" font-size="18" font-weight="400">전투 수행의 부담</text><path d="M320 160H350" stroke="#79583e" stroke-width="2" marker-end="url(#arrow)"/><path d="M646 160H676" stroke="#79583e" stroke-width="2" marker-end="url(#arrow)"/></svg>