<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" role="img" aria-labelledby="title desc"><title id="title">안밖: 익힌 전조를 다른 동선에 적용</title><desc id="desc">두 상황 모두 안쪽이 안전하다. 첫 상황은 직선으로, 두 번째 상황은 차단 구간을 피해 열린 통로로 이동한다.</desc><style>text{font-family:SUIT,Malgun Gothic,sans-serif;fill:#303b34;font-size:18px} .small{font-size:15px;fill:#526057}.label{font-weight:700}.line{stroke:#8a9b8d;stroke-width:2;fill:none}.route{stroke:#27654a;stroke-width:4;fill:none;marker-end:url(#arrow)} .player{fill:#fff;stroke:#355f49;stroke-width:2}.safe{fill:#dfece1;stroke:#7ea58b;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#27654a"/></marker></defs><rect width="480" height="410" fill="#f7f8f3"/><text x="24" y="33" text-anchor="start" class="label">통로가 열려 있을 때</text><ellipse cx="205" cy="112" rx="160" ry="65" fill="none" stroke="#a5b3a5" stroke-width="2"/><ellipse class="safe" cx="205" cy="112" rx="76" ry="47"/><text x="205" y="104" text-anchor="middle" class="label">안쪽 안전</text><text x="205" y="132" text-anchor="middle" class="small">보스</text><circle class="player" cx="368" cy="112" r="17"/><text x="368" y="118" text-anchor="middle" class="label">나</text><text x="24" y="226" text-anchor="start" class="label">직선 통로가 막혔을 때</text><ellipse cx="205" cy="305" rx="160" ry="65" fill="none" stroke="#a5b3a5" stroke-width="2"/><ellipse class="safe" cx="205" cy="305" rx="76" ry="47"/><text x="205" y="297" text-anchor="middle" class="label">안쪽 안전</text><text x="205" y="325" text-anchor="middle" class="small">보스</text><circle class="player" cx="368" cy="305" r="17"/><text x="368" y="311" text-anchor="middle" class="label">나</text><path class="route" d="M347 112H285"/><path d="M305 266L319 344" stroke="#7c756e" stroke-width="12"/><path class="route" d="M366 283Q356 230 282 239Q256 244 254 270"/><text x="407" y="352" text-anchor="middle" class="small">차단</text><text x="236" y="391" text-anchor="middle" class="small">전조의 의미 유지 · 이동 가능한 길 확인</text></svg>